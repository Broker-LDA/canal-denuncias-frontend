server {
    listen 80;
    server_name _;

    # 1. Serve os arquivos estáticos do React (Frontend)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy para a API Interna (Injeta a chave de segurança)
    location /api/interno/ {
        # IMPORTANTE: Substitua pelo nome exato do container do seu backend no EasyPanel
        proxy_pass http://lda_canal_denuncia_backend:3001/api/interno/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AQUI ESTÁ A SEGURANÇA: Substitua pela sua chave real do .env do backend
        proxy_set_header X-Internal-Api-Key "67d14610ad233939db31a852f9b708973c8ebcab41dc6b78a0098148c22057a3279605b34a9e2a27a746eca4b730a386";
    }

    # 3. Proxy para a API Pública (Sem chave)
    location /api/canal/ {
        proxy_pass http://lda_canal_denuncia_backend:3001/api/canal/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}